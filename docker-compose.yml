services:
  db:
    image: postgres:16
    container_name: rip-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rip
      POSTGRES_PASSWORD: rip
      POSTGRES_DB: rip
    ports:
      - "5432:5432"
    volumes:
      - rip_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rip"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rip_pgdata:
