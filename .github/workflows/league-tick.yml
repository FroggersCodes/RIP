name: League tick

# Drives the live league clock for hosts that sleep when idle (e.g. Render free).
# The endpoint is idempotent — it only advances when the cadence has elapsed.
# Set repo secrets APP_URL (e.g. https://rip-xxxx.onrender.com) and ADMIN_TOKEN.

on:
  schedule:
    - cron: '7 * * * *' # hourly
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Advance league if due
        env:
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$APP_URL" ]; then echo "APP_URL secret not set; skipping."; exit 0; fi
          curl -fsS -X POST "$APP_URL/api/admin/tick" -H "x-admin-token: ${ADMIN_TOKEN:-dev-admin}" || echo "tick request failed"
