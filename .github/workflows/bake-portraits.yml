name: Bake player portraits

# Generates a photorealistic headshot for every player and commits them to
# web/public/players/<slug>.jpg.
#
# Run from the Actions tab → "Bake player portraits" → "Run workflow".
#
# Providers:
#   pollinations  free, no key, uses flux-realism model (~1 min for all players)
#   dalle         DALL-E 3, best quality, requires OPENAI_API_KEY secret (~$0.04/player)
#   openai        gpt-image-1, requires OPENAI_API_KEY secret

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Image provider'
        type: choice
        options: [pollinations, dalle, openai]
        default: pollinations
      branch:
        description: 'Branch to commit portraits to'
        default: 'claude/coding-session-awr7le'

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Bake portraits
        working-directory: server
        env:
          IMAGE_PROVIDER: ${{ inputs.provider }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BAKE_CONCURRENCY: '6'
        run: npm run bake:portraits
      - name: Commit portraits
        run: |
          git config user.name "rip-bot"
          git config user.email "bot@users.noreply.github.com"
          git add web/public/players
          if git diff --cached --quiet; then
            echo "No new portraits to commit."
          else
            git commit -m "Bake player portraits [${{ inputs.provider }}] (run ${GITHUB_RUN_NUMBER})"
            git push
          fi
